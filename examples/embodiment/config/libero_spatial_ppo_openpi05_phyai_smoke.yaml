defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0
    rollout,env: 1

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RLINF_SMOKE_LOG_DIR,/tmp/rlinf-phyai-smoke}
    project_name: rlinf
    experiment_name: phyai-functional-smoke
    logger_backends: []
  max_epochs: 2
  max_steps: 2
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  weight_sync_interval: 1

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  python_interpreter_path: /opt/venv/rlinf-openpi/bin/python
  train:
    rollout_epoch: 1
    total_num_envs: 2
    max_episode_steps: 5
    max_steps_per_rollout_epoch: 5
    video_cfg:
      save_video: false
  eval:
    rollout_epoch: 0
    total_num_envs: 2
    max_episode_steps: 5
    max_steps_per_rollout_epoch: 5
    video_cfg:
      save_video: false

rollout:
  group_name: RolloutGroup
  rollout_backend: phyai
  generation_backend: huggingface
  python_interpreter_path: /opt/venv/rlinf-phyai/bin/python
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:PHYAI_CHECKPOINT,/data/models/pi05_base}
    precision: bf16
  phyai:
    plugin: pi05
    checkpoint_dir: ${oc.env:PHYAI_CHECKPOINT,/data/models/pi05_base}
    max_batch_size: 2
    num_images: 2
    model_action_horizon: 10
    state_dim: 8
    norm_stats_path: ${oc.env:OPENPI_NORM_STATS,/data2/models/RLinf-Pi05-LIBERO-SFT/physical-intelligence/libero/norm_stats.json}
    tokenizer_name: ${oc.env:PI05_TOKENIZER,/data/models/paligemma-3b-pt-224-tokenizer}
    processor_from_pretrained: false
    normalize_pixels: true
    params_dtype: bf16
    vision_params_dtype: null
    use_cuda_graph: false
    runtime: {}

actor:
  group_name: ActorGroup
  python_interpreter_path: /opt/venv/rlinf-openpi/bin/python
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 2
  seed: 42
  enable_offload: false
  model:
    model_path: ${oc.env:ACTOR_CHECKPOINT,/data2/models/RLinf-Pi05-LIBERO-SFT}
    num_action_chunks: 5
    num_steps: 3
    add_value_head: true
    openpi:
      detach_critic_input: true
      value_after_vlm: true
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-5
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 5
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
